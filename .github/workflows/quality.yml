name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: PHP, frontend, and public contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_ENV: testing
      APP_URL: http://localhost
      APP_LOCALE: en
      APP_FALLBACK_LOCALE: en
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      OCTANE_RUNTIME_REQUIRED: 'false'

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: gd, mbstring, pdo_sqlite, opcache
          ini-values: opcache.enable_cli=1, variables_order=EGPCS
          coverage: none
          tools: composer:v2

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Prepare a fresh application environment
        run: cp .env.example .env

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install locked PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate the disposable application key
        run: php artisan key:generate --no-interaction

      - name: Verify the PHP runtime
        run: |
          composer check-platform-reqs
          composer check:runtime

      - name: Install locked JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Build the frontend
        run: bun run build

      - name: Check PHP formatting
        run: vendor/bin/pint --test

      - name: Run the public PHP test suite
        run: composer test

      - name: Regenerate the public API contract
        run: bun run api:generate

      - name: Check and build the Nuxt client
        run: |
          bun run nuxt-api:test
          bun run nuxt-api:typecheck
          bun run nuxt-api:build

      - name: Verify the public source boundary and generated files
        run: |
          composer check:public-boundary
          git diff --exit-code

      - name: Audit PHP dependencies
        run: composer audit --locked --no-interaction

      - name: Audit JavaScript dependencies
        run: bun audit

  release:
    name: Publish the tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the verified tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract release notes from the changelog
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ['GITHUB_REF_NAME']
          version = tag.removeprefix('v')
          changelog = Path('CHANGELOG.md').read_text(encoding='utf-8')
          pattern = rf'^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## |\Z)'
          matches = re.findall(pattern, changelog, flags=re.MULTILINE | re.DOTALL)
          if len(matches) != 1 or not matches[0].strip():
              raise SystemExit(f'Expected one non-empty CHANGELOG.md section for {tag}.')
          repository_url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/blob/{tag}/"
          body = re.sub(
              r'(\]\()((?:\./)?docs/[^)\s]+)(\))',
              lambda match: f"{match[1]}{repository_url}{match[2].removeprefix('./')}{match[3]}",
              matches[0].strip(),
          )
          notes = Path(os.environ['RUNNER_TEMP']) / 'release-notes.md'
          notes.write_text(body + '\n', encoding='utf-8')
          PY

      - name: Create or verify the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json tagName,isDraft,body,url > "$RUNNER_TEMP/existing-release.json"; then
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          temporary = Path(os.environ['RUNNER_TEMP'])
          release = json.loads((temporary / 'existing-release.json').read_text(encoding='utf-8'))
          expected_notes = (temporary / 'release-notes.md').read_text(encoding='utf-8').strip()
          if release['tagName'] != os.environ['GITHUB_REF_NAME'] or release['isDraft']:
              raise SystemExit('The existing release must be published for this tag.')
          if release['body'].strip() != expected_notes:
              raise SystemExit('Existing release notes differ from the tagged changelog; no changes were made.')
          print(release['url'])
          PY
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
